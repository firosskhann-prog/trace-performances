<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>TRACE — MindAR Test</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    #ui{position:fixed;inset:0;z-index:9999;pointer-events:none;color:#fff}
    #top{position:absolute;top:max(16px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:center}
    #status{background:rgba(0,0,0,.68);padding:10px 14px;border-radius:999px;font-size:15px;text-align:center}
    #startWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;pointer-events:auto}
    #start{border:0;border-radius:14px;background:#fff;color:#111;padding:15px 22px;font-size:18px;font-weight:650}
    #hint{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:20px;right:20px;text-align:center;font-size:14px;background:rgba(0,0,0,.58);padding:10px;border-radius:12px}
  </style>
</head>
<body>
  <div id="ui">
    <div id="top"><div id="status">Ready</div></div>
    <div id="startWrap"><button id="start" type="button">START TRACE</button></div>
    <div id="hint">Point the camera at the NEON target image.</div>
  </div>

  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets>
      <img id="moon" src="./response-moon.jpg" alt="Moon response image" />
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-plane src="#moon" position="0 0 0.02" width="1" height="1" material="shader: flat; transparent: true"></a-plane>
    </a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector('#scene');
    const target = document.querySelector('#target');
    const start = document.querySelector('#start');
    const startWrap = document.querySelector('#startWrap');
    const status = document.querySelector('#status');

    const setStatus = (text) => { status.textContent = text; };

    target.addEventListener('targetFound', () => setStatus('TRACE FOUND'));
    target.addEventListener('targetLost', () => setStatus('Scanning…'));

    start.addEventListener('click', async () => {
      start.disabled = true;
      setStatus('Starting camera…');
      try {
        if (!scene.hasLoaded) {
          await new Promise(resolve => scene.addEventListener('loaded', resolve, {once:true}));
        }
        await scene.systems['mindar-image-system'].start();
        startWrap.style.display = 'none';
        setStatus('Scanning…');
      } catch (err) {
        console.error(err);
        start.disabled = false;
        setStatus('Could not start. Check camera permission and targets.mind.');
      }
    });
  </script>
</body>
</html>
